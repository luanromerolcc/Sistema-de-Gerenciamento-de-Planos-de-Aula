version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-dev
    restart: always
    environment:
      POSTGRES_USER: lessonuser
      POSTGRES_PASSWORD: lessonpass
      POSTGRES_DB: lessonplans
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    restart: always
    ports:
      - '6379:6379'

  backend:
    build:
      context: ./backend
    container_name: backend-dev
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/src:/app/src
    command: npm run dev
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: frontend-dev
    restart: always
    ports:
      - '5173:5173'
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_URL=http://localhost:3000/api
    command: npm run dev -- --host
    depends_on:
      - backend

volumes:
  postgres_data_dev: