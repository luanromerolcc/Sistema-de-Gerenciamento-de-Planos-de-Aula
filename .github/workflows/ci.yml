name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: lessonplans
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Lint backend
        run: cd backend && npm run lint
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Prisma Database Push
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/lessonplans
        run: cd backend && npx prisma db push

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/lessonplans
          REDIS_URL: redis://localhost:6379
          GROQ_API_KEY: gsk_test_fake_key_for_ci
          NODE_ENV: test
        run: cd backend && npm test -- --coverage
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}

      - name: Build backend check
        run: cd backend && npm run build --if-present

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Lint frontend
        run: cd frontend && npm run lint
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}

      - name: Build frontend
        run: cd frontend && npm run build
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}

      - name: Upload backend coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/coverage-final.json
          flags: backend
        continue-on-error: true
        