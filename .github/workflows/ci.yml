name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: lessonplans
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      # Setup unificado para Backend e Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Lint backend
        run: cd backend && npm run lint

      - name: Run Prisma Database Push
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/lessonplans
        run: cd backend && npx prisma db push

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/lessonplans
          REDIS_URL: redis://localhost:6379
          ANTHROPIC_API_KEY: sk-ant-test
          NODE_ENV: test
        run: cd backend && npm test -- --coverage

      - name: Build backend check

        run: cd backend && npm run build --if-present 

      # Frontend
      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Lint frontend
        run: cd frontend && npm run lint

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Upload backend coverage
        uses: codecov/codecov-action@v3 # Revertido para v3 para evitar exigência de token
        with:
          files: ./backend/coverage/coverage-final.json
          flags: backend